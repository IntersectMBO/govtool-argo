{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govtool.serviceName" (dict "root" $ "name" $name) }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "govtool.name" $ }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ default 1 $svc.replicaCount }}
  {{- with $svc.strategy }}
  strategy:
{{ toYaml . | indent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "govtool.name" $ }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "govtool.name" $ }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      # No service needs the Kubernetes API, and the token's mount under
      # /run/secrets would collide with secretMounts there.
      automountServiceAccountToken: false
      {{- with $svc.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- with $svc.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
          {{- if or $svc.env $svc.secretEnv }}
          env:
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ tpl ($value | toString) $ | quote }}
            {{- end }}
            {{- range $svc.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ .key }}
            {{- end }}
          {{- end }}
          {{- with $svc.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- with $svc.readinessProbe }}
          readinessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          resources:
{{ toYaml (default $.Values.resources.default $svc.resources) | indent 12 }}
          {{- if or (and $svc.configMount $svc.configMount.enabled) (and $svc.volume $svc.volume.enabled) $svc.secretMounts $svc.configMapMounts }}
          volumeMounts:
            {{- if and $svc.configMount $svc.configMount.enabled }}
            - name: config
              mountPath: {{ $svc.configMount.mountPath }}
              subPath: {{ $svc.configMount.subPath }}
              readOnly: true
            {{- end }}
            {{- if and $svc.volume $svc.volume.enabled }}
            - name: {{ $svc.volume.name }}
              mountPath: {{ $svc.volume.mountPath }}
            {{- end }}
            {{- range $svc.secretMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- range $svc.configMapMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (and $svc.configMount $svc.configMount.enabled) (and $svc.volume $svc.volume.enabled) $svc.secretMounts $svc.configMapMounts }}
      volumes:
        {{- if and $svc.configMount $svc.configMount.enabled }}
        - name: config
          secret:
            secretName: {{ $svc.configMount.secretName }}
        {{- end }}
        {{- if and $svc.volume $svc.volume.enabled }}
        - name: {{ $svc.volume.name }}
          hostPath:
            path: {{ $svc.volume.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- range $svc.secretMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        {{- range $svc.configMapMounts }}
        - name: {{ .name }}
          configMap:
            name: {{ .configMapName }}
            defaultMode: 0755
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
