apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: govtool
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cardanoapi/govtool-argo.git
    targetRevision: main
    path: .
    helm:
      releaseName: govtool
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: govtool
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true